<div class="w-[100%]">
    <!-- Breadcumb div -->
    <div class="w-[100%] border-b-[2px]  ">
        <div class="w-[100%] flex justify-between h-[10vh]">
            <div class="2xl:w-[20%] md:w-[30%]  xl:w-[30%]  flex justify-end items-center 2xl:pr-5 xl:pr-4">

                <nav class="flex">
                    <ol class="inline-flex items-center space-x-1 md:space-x-3">
                        <li class="inline-flex items-center">
                            <a href="#"
                                class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-blue-600 dark:text-gray-400 dark:hover:text-white">
                                <svg class="w-3 h-3 mr-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                    fill="currentColor" viewBox="0 0 20 20">
                                    <path
                                        d="m19.707 9.293-2-2-7-7a1 1 0 0 0-1.414 0l-7 7-2 2a1 1 0 0 0 1.414 1.414L2 10.414V18a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7.586l.293.293a1 1 0 0 0 1.414-1.414Z" />
                                </svg>
                                Home
                            </a>
                        </li>
                        <li>
                            <div class="flex items-center">
                                <svg class="w-3 h-3 text-gray-400 mx-1" aria-hidden="true"
                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                        stroke-width="2" d="m1 9 4-4-4-4" />
                                </svg>
                                <a href="#"
                                    class="ml-1 text-sm font-medium text-gray-700 hover:text-blue-600 md:ml-2 dark:text-gray-400 dark:hover:text-white">kid-page</a>
                            </div>
                        </li>
                    </ol>
                </nav>

            </div>
            <div class="2xl:w-[20%] md:w-[30%] xl:w-[30%]   flex justify-start items-center 2xl:pl-5 xl:pl-4">

                <button id="dropdownDefaultButton" data-dropdown-toggle="dropdown"
                class="bg-gray-200 dark:bg-gray-700 focus:outline-none transition duration-150 ease-in-out rounded hover:bg-gray-300 dark:hover:bg-gray-600 dark:text-indigo-600 text-black px-6 py-2 text-sm focus:ring-4 focus:ring-blue-300 text-center inline-flex items-center dark:focus:ring-blue-800"
                type="button">Dropdown button <svg class="w-2.5 h-2.5 ml-2.5" aria-hidden="true"
                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="m1 1 4 4 4-4" />
                </svg></button>
                <div id="dropdown"
                    class="z-10 hidden bg-white divide-y divide-gray-100 rounded-lg shadow w-44 dark:bg-gray-700">
                    <ul class="py-2 text-sm text-gray-700 dark:text-gray-200" aria-labelledby="dropdownDefaultButton">
                        <li>
                            <a href="#"
                                class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Dashboard</a>
                        </li>
                        <li>
                            <a href="#"
                                class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Settings</a>
                        </li>
                       
                    </ul>
                </div>

            </div>
        </div>
    </div>

    <div class="w-[100%] flex mt-5 justify-center">
        <div class="w-[85%] ">
            <div class="w-[100%] text-[20px] h-[3em] flex justify-center items-center bg-gradient-to-r from-white via-red-500 to-white">
                Sale Ends In: 16 H : 07 M : 22 S
            </div>
        </div>
    </div>
    <div class="w-[100%]  mt-10 flex justify-center">

        <div id="default-carousel" class="relative w-[85%] " data-carousel="slide">
            <app-carousel [items]="items"></app-carousel>
        </div>

    </div>

    <app-product-card4-departmentpage [heading]="ProductData.data1.heading" [subHeading]="ProductData.data1.subheading" [ProductData]="ProductData.data1.product"></app-product-card4-departmentpage>
    <app-product-card4-departmentpage [heading]="ProductData.data2.heading" [subHeading]="ProductData.data2.subheading" [ProductData]="ProductData.data2.product"></app-product-card4-departmentpage>
    <app-product-card4-departmentpage [heading]="ProductData.data3.heading" [subHeading]="ProductData.data3.subheading" [ProductData]="ProductData.data3.product"></app-product-card4-departmentpage>
</div>
