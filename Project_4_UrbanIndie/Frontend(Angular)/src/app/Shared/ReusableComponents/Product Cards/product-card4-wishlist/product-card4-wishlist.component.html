<div [class]="grid_style" *ngIf="Data">
    <div (click)="goToProductPage(item)" *ngFor="let item of Data | appFilter:searchText">
        <div [class]="style_class" class="hover:shadow-xl ">

            <div [class]="image_card_style" class="p-2 relative">

                <!--------------- heart button in image------------------>
                <span class="absolute 2xl:ml-[80%] mt-[10px]    ml-[78%]">

                    <svg (click)="removeFromFavorites(item,$event)" xmlns="http://www.w3.org/2000/svg" width="30"
                        height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>

                    
                </span>

                <img class=" w-[100%] rounded-md h-[100%]"
                src="{{item.product_images[0]}}"
                    alt={{item.img}} />
            </div>

            <div class="w-[100%] px-2 pb-2">
                <!--------------card title------------------------------------------------>
                <div class="w-[100%]">
                    <h6
                        class="  font-semibold tracking-tight text-gray-900 dark:text-white overflow-hidden overflow-ellipsis line-clamp-2">
                        <div class="h-10 text-[17px] overflow-hidden">
                            <!-- <div class="truncate"> -->
                            <!-- {{ item.product_title }} -->
                            {{item.departmentType}} + {{item.apparelCategory}} + {{item.productType}}
                            <!-- </div> -->
                        </div>
                    </h6>

                </div>


                <div class="px-1">
                    <span class="line-through  text-gray-500">₹{{item.product_mrp}}</span>
                    <span class="text-black ml-2 text-[18px]">₹{{item.product_price}}</span>
                    <span class="ml-2 text-[18px] text-red-500">
                        {{item.product_discount}}%
                    </span>
                </div>

                <div class="w-[100%] py-1  flex font-font1 text-[16px] text-gray-600 ">
                    +{{item.product_size==undefined?0:item.product_size.length}} colours
                </div>
                <!---------------Stars rating---------->
                <div class="w-[100%] flex items-center py-1">
                    <svg aria-hidden="true" class="w-5 h-5 text-black" fill="currentColor" viewBox="0 0 20 20"
                        xmlns="http://www.w3.org/2000/svg">
                        <title>First star</title>
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z">
                        </path>
                    </svg>
                    <svg aria-hidden="true" class="w-5 h-5 text-black" fill="currentColor" viewBox="0 0 20 20"
                        xmlns="http://www.w3.org/2000/svg">
                        <title>Second star</title>
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z">
                        </path>
                    </svg>
                    <svg aria-hidden="true" class="w-5 h-5 text-black" fill="currentColor" viewBox="0 0 20 20"
                        xmlns="http://www.w3.org/2000/svg">
                        <title>Third star</title>
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z">
                        </path>
                    </svg>
                    <svg aria-hidden="true" class="w-5 h-5 text-black" fill="currentColor" viewBox="0 0 20 20"
                        xmlns="http://www.w3.org/2000/svg">
                        <title>Fourth star</title>
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z">
                        </path>
                    </svg>
                    <svg aria-hidden="true" class="w-5 h-5 text-black" fill="currentColor" viewBox="0 0 20 20"
                        xmlns="http://www.w3.org/2000/svg">
                        <title>Fifth star</title>
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z">
                        </path>
                    </svg>
                    <span
                        class="bg-blue-100 text-blue-800 text-xs font-semibold mr-1 px-2.5 py-0.5 rounded dark:bg-blue-200 dark:text-blue-800 ml-3">{{item.product_average_rating}}</span>
                </div>

                <!-- add to bag button -->
                <div class="w-[100%] py-2 ">

                    <ng-container *ngIf="item.addInCart==false">
                        <app-button [title]="'Add To Bag'" (click)="addToCart(item,$event)"
                            [style]="' w-[100%] p-2 bg-text hover:bg-black hover:text-white text-red-600 border-2 border-black rounded-lg text-[18px]'"></app-button>
                    </ng-container>
                    <ng-container *ngIf="item.addInCart==true">
                        <app-button [title]="'Go To Bag'" routerLink="/order/cart-page"
                            [style]="' w-[100%] p-2 bg-text bg-black text-white text-red-600 border-2 border-black rounded-lg text-[18px]'"></app-button>
                    </ng-container>

                </div>
            </div>
        </div>
    </div>
</div>
