<div class="w-[100%] mt-[3%]  pt-5">

    <div class="text-[20px] lg:text-[30px] flex justify-center items-center w-[100%] ">{{ContainerTitle}}</div>
    <div class="mt-5">
        <div class="w-[100%]  items-center flex justify-center">
            <div class="w-[100%] grid grid-cols-1 md:grid-cols-3  xl:grid-cols-4 gap-5">
                <div class="w-[100%]  mt-[4%] " *ngFor="let item of New_Arrival" >
                    <div [class]="item.img" class="bg-cover bg-center w-[100%] h-[405px]"></div>
                    <div class=" xl:text-[18px] 2xl:text-[20px] mt-3">Khakis Bleached Denim Trucker Jacket</div>
                    <div class="w-[100%] mt-2 font-bold flex font-font1 ">
                        <span class="xl:text-[15px] 2xl:text-[17px] line-through  text-gray-500">₹ 999</span>
                        <span class="text-black ml-2">₹799</span>
                        <span class="text-red-500 ml-2 xl:text-[15px] 2xl:text-[17px]">20% OFF</span>
                    </div>
                    <div class="w-[100%] mt-2 xl:text-[15px] 2xl:text-[17px] flex font-font1 text-gray-500 text-[17px]">
                        +2 colours
                    </div>
                    <div class="w-[100%] mt-2 items-center flex font-font1 text-gray-700 text-[17px]">
                        <div class="flex">
                            <svg width="18" height="17" viewBox="0 0 18 17" fill="none"

                                    fill="black" />
        
                            </svg>
                            <svg width="18" height="17" viewBox="0 0 18 17" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M3.854 16.3333L5.20817 10.4792L0.666504 6.54167L6.6665 6.02083L8.99984 0.5L11.3332 6.02083L17.3332 6.54167L12.7915 10.4792L14.1457 16.3333L8.99984 13.2292L3.854 16.3333Z"

                                <path

                                    fill="black" />

                                    d="M8.99984 4.77083V11.2708L11.6248 12.875L10.9373 9.875L13.2498 7.875L10.2082 7.60417L8.99984 4.77083ZM3.854 16.3333L5.20817 10.4792L0.666504 6.54167L6.6665 6.02083L8.99984 0.5L11.3332 6.02083L17.3332 6.54167L12.7915 10.4792L14.1457 16.3333L8.99984 13.2292L3.854 16.3333Z"
                                    fill="black" />
                            </svg>
        
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="w-[100%] flex justify-center items-center mt-[3%]">
        <div class="w-[50%] xl:w-[30%] 2xl:w-[20%]">
            <app-button [title]="'Show more'"
                [style]="'w-[100%] rounded-full bg-gray-200 text-black p-3 text-[18px]'"></app-button>
        </div>
    </div>
