<div class="w-[100%]">
    <div>
        <h1>Statement</h1>
    </div>
    <div class="w-[100%] flex justify-between items-center ">

        <div class="w-[40%]  flex justify-around ">
            <div (click)="openStartDatePicker()" class="relative max-w-sm">
                <div matIconSuffix class="absolute inset-y-0 left-0 flex items-center pl-3.5 ">
                    <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                        <path
                            d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z" />
                    </svg>
                </div>
                <input matInput [(ngModel)]="selectedStartDate" [max]="today_date" [matDatepicker]="start"
                    type="text"
                    class="bg-gray-50 border   border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    placeholder="Select Start date">
                <!-- <mat-datepicker-toggle [for]="end"></mat-datepicker-toggle> -->
                <mat-datepicker #start></mat-datepicker>
            </div>
            <div (click)="openEndDatePicker()" class="relative max-w-sm">
                <div matIconSuffix class="absolute inset-y-0 left-0 flex items-center pl-3.5 ">
                    <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                        <path
                            d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z" />
                    </svg>
                </div>
                <input [(ngModel)]="selectedEndDate" [max]="today_date" matInput [matDatepicker]="end" type="text"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    placeholder="Select End date">
                <!-- <mat-datepicker-toggle [for]="end"></mat-datepicker-toggle> -->
                <mat-datepicker #end></mat-datepicker>
            </div>
        </div>


        <div class="w-[60%]  ml-5 ">
            <button (click)="searchStatement()"
                class="relative w-[20%]  inline-flex items-center justify-center p-0.5 mb-2 mr-2 overflow-hidden text-sm font-medium text-gray-900 rounded-lg group bg-gradient-to-br from-purple-600 to-blue-500 group-hover:from-purple-600 group-hover:to-blue-500 hover:text-white dark:text-white focus:ring-4 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800">
                <span
                    class="w-[100%] relative px-5 py-2.5 transition-all ease-in duration-75 bg-white dark:bg-gray-900 rounded-md group-hover:bg-opacity-0">
                    Search
                </span>
            </button>

        </div>


    </div>
    <div class="w-[100%] mt-5 flex justify-center ">

        <div *ngIf="loading==false && loaded==true"
            class="w-[98%] border-2 border-gray-300  bg-white  shadow   dark:border-gray-700 dark:hover:bg-gray-700 rounded-2xl flex flex-col justify-between  p-6 hover:cursor-pointer ">

            <div class="grid gap-6 mb-6 md:grid-cols-5">
                <div>
                    <label for="Start_Date"
                        class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Start Date</label>
                    <input [(ngModel)]="this.TransactionData.start_date" disabled type="text" id="Start_Date"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                        required>
                </div>
                <div>
                    <label for="end_date" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">End
                        Date</label>
                    <input [(ngModel)]="this.TransactionData.end_date" disabled type="text" id="end_date"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                        required>
                </div>
                <div>
                    <label for="total_credit"
                        class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Total Credit</label>
                    <input [(ngModel)]="this.TransactionData.total_credit" disabled type="text" id="total_credit"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                        required>
                </div>
                <div>
                    <label for="total_debit"
                        class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Total Debit</label>
                    <input [(ngModel)]="this.TransactionData.total_debit" disabled type="text" id="total_debit"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                        required>
                </div>
                <div>
                    <label for="open_account"
                        class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Opening Amount</label>
                    <input [(ngModel)]="this.TransactionData.opening_balance" disabled type="text" id="open_account"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                        required>
                </div>
            </div>
            <button *ngIf="TransactionData.transaction.length!=0"
                class="relative w-[20%]  inline-flex items-center justify-center p-0.5 mb-2 mr-2 overflow-hidden text-sm font-medium text-gray-900 rounded-lg group bg-gradient-to-br from-teal-300 to-lime-300 group-hover:from-teal-300 group-hover:to-lime-300 dark:text-white dark:hover:text-gray-900 focus:ring-4 focus:outline-none focus:ring-lime-200 dark:focus:ring-lime-800">
                <span
                    class="w-[100%] relative px-5 py-2.5 transition-all ease-in duration-75 bg-white dark:bg-gray-900 rounded-md group-hover:bg-opacity-0">
                    Download as PDF
                </span>
            </button>

        </div>

    </div>
    <div class="w-[100%] mt-5 flex justify-center">
        <ng-container *ngIf="loading==true && loaded==false">
            <div
                class="flex items-center justify-center w-[97%] h-[400px]  border border-gray-200 rounded-lg bg-gray-50 dark:bg-gray-800 dark:border-gray-700">
                <div
                    class="px-7 py-3 text-[18px] font-medium leading-none text-center text-blue-800 bg-blue-200 rounded-full animate-pulse dark:bg-blue-900 dark:text-blue-200">
                    loading...</div>
            </div>
        </ng-container>
        <div *ngIf="loading==false && loaded==true"
            class=" w-[98%] border-2 border-gray-300  bg-white  shadow   dark:border-gray-700 dark:hover:bg-gray-700 rounded-2xl flex flex-col justify-between  p-6 hover:cursor-pointer">
            <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                    <tr>
                        <th scope="col" class="px-6 py-3">
                            S.no
                        </th>
                        <th scope="col" class="px-6 py-3">
                            Description
                        </th>
                        <th scope="col" class="px-6 py-3">
                            Debit
                        </th>
                        <th scope="col" class="px-6 py-3">
                            Credit
                        </th>
                        <th scope="col" class="px-6 py-3">
                            Transaction Date
                        </th>
                        <th scope="col" class="px-6 py-3">
                            Balance
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of TransactionData.transaction;index as i"
                        class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                        <td class="w-4 p-4 ">
                            <div class="flex justify-center">
                                <h3>{{i+1}}</h3>
                            </div>
                        </td>
                        <th scope="row"
                            class="flex items-center px-6 py-4 text-gray-900 whitespace-nowrap dark:text-white">
                            <img class="w-10 h-10 rounded-full" src="https://flowbite.com/docs/images/logo.svg"
                                alt="Jese image">

                            <div class="pl-3">
                                <div class="text-base font-semibold">{{item.account_number}}</div>
                                <div class="font-normal text-gray-500">{{item.description}}</div>
                            </div>
                        </th>
                        <td class="px-6 py-4 font-medium text-red-500">
                            {{item.type.toLowerCase()=="debit"?'Rs ' +item.amount:'-'}}
                        </td>
                        <td class="px-6 py-4 font-medium text-green-500">
                            {{item.type.toLowerCase()=="credit"?'Rs '+ item.amount:'-'}}
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex  items-center text-gray-500">
                                {{item.transaction_date}}
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <a href="#" class="font-medium text-gray-700  hover:underline">
                                Rs {{item.balance}}
                            </a>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>
    </div>
</div>
