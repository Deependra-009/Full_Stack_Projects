<div class="w-[100%]">
    <div class="border-b border-gray-200 dark:border-gray-700">
        <ul class="flex flex-wrap -mb-px text-sm font-medium text-center text-gray-500 dark:text-gray-400"
            id="myTab" data-payment_tabs-toggle="#myTabContent" role="tablist">

            <li class="mr-2 hover:cursor-pointer" role="presentation">
                <a [class]="(tab==1)?'text-blue-700':'none'" type="button" (click)="changeTab(1)"
                    class=" inline-flex items-center justify-center p-4  group" aria-current="page">
                    <svg class="w-4 h-4 mr-2 " aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                        fill="currentColor" viewBox="0 0 18 18">
                        <path
                            d="M6.143 0H1.857A1.857 1.857 0 0 0 0 1.857v4.286C0 7.169.831 8 1.857 8h4.286A1.857 1.857 0 0 0 8 6.143V1.857A1.857 1.857 0 0 0 6.143 0Zm10 0h-4.286A1.857 1.857 0 0 0 10 1.857v4.286C10 7.169 10.831 8 11.857 8h4.286A1.857 1.857 0 0 0 18 6.143V1.857A1.857 1.857 0 0 0 16.143 0Zm-10 10H1.857A1.857 1.857 0 0 0 0 11.857v4.286C0 17.169.831 18 1.857 18h4.286A1.857 1.857 0 0 0 8 16.143v-4.286A1.857 1.857 0 0 0 6.143 10Zm10 0h-4.286A1.857 1.857 0 0 0 10 11.857v4.286c0 1.026.831 1.857 1.857 1.857h4.286A1.857 1.857 0 0 0 18 16.143v-4.286A1.857 1.857 0 0 0 16.143 10Z" />
                    </svg>Same Bank
                </a>

            </li>
            <li class="mr-2 hover:cursor-pointer" role="presentation">
                <a type="button" [class]="(tab==2)?'text-blue-700':'none'" (click)="changeTab(2)"
                    class="inline-flex items-center justify-center p-4  group" aria-current="page">
                    <svg class="w-4 h-4 mr-2 " aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                        fill="currentColor" viewBox="0 0 18 18">
                        <path
                            d="M6.143 0H1.857A1.857 1.857 0 0 0 0 1.857v4.286C0 7.169.831 8 1.857 8h4.286A1.857 1.857 0 0 0 8 6.143V1.857A1.857 1.857 0 0 0 6.143 0Zm10 0h-4.286A1.857 1.857 0 0 0 10 1.857v4.286C10 7.169 10.831 8 11.857 8h4.286A1.857 1.857 0 0 0 18 6.143V1.857A1.857 1.857 0 0 0 16.143 0Zm-10 10H1.857A1.857 1.857 0 0 0 0 11.857v4.286C0 17.169.831 18 1.857 18h4.286A1.857 1.857 0 0 0 8 16.143v-4.286A1.857 1.857 0 0 0 6.143 10Zm10 0h-4.286A1.857 1.857 0 0 0 10 11.857v4.286c0 1.026.831 1.857 1.857 1.857h4.286A1.857 1.857 0 0 0 18 16.143v-4.286A1.857 1.857 0 0 0 16.143 10Z" />
                    </svg>Other Bank
                </a>
            </li>
            <li class="mr-2 hover:cursor-pointer" role="presentation">
                <a class="cursor-not-allowed inline-flex items-center justify-center p-4  group">
                    <svg class="w-4 h-4 mr-2 " aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                        fill="currentColor" viewBox="0 0 18 18">
                        <path
                            d="M6.143 0H1.857A1.857 1.857 0 0 0 0 1.857v4.286C0 7.169.831 8 1.857 8h4.286A1.857 1.857 0 0 0 8 6.143V1.857A1.857 1.857 0 0 0 6.143 0Zm10 0h-4.286A1.857 1.857 0 0 0 10 1.857v4.286C10 7.169 10.831 8 11.857 8h4.286A1.857 1.857 0 0 0 18 6.143V1.857A1.857 1.857 0 0 0 16.143 0Zm-10 10H1.857A1.857 1.857 0 0 0 0 11.857v4.286C0 17.169.831 18 1.857 18h4.286A1.857 1.857 0 0 0 8 16.143v-4.286A1.857 1.857 0 0 0 6.143 10Zm10 0h-4.286A1.857 1.857 0 0 0 10 11.857v4.286c0 1.026.831 1.857 1.857 1.857h4.286A1.857 1.857 0 0 0 18 16.143v-4.286A1.857 1.857 0 0 0 16.143 10Z" />
                    </svg>Multiple Internal Transfer
                </a>
            </li>



        </ul>
    </div>
    <!-- tab component -->




    <div id="myTabContent" class="mt-5">
        <div [ngClass]="tab==1?'block':'hidden'" class=" p-4 rounded-lg">

            <div class="w-[50%]">
                <!-- account to be debited -->
                <div class="mb-6">
                    <label for="debited"
                        class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Account to be
                        debited</label>
                    <input type="text" id="debited" [(ngModel)]="AccountNumber"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                        [disabled]="true" required>
                </div>
                <!-- account to be credited -->

                <div class="mb-6">
                    <div class="flex justify-between items-center">
                        <label for="debited"
                            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Account to be
                            Credited</label>
                        <button routerLink="/user/beneficiary-maintenance-page"
                            class="relative inline-flex items-center justify-center p-0.5 mb-2 mr-2 overflow-hidden text-sm font-medium text-gray-900 rounded-lg group bg-gradient-to-br from-purple-600 to-blue-500 group-hover:from-purple-600 group-hover:to-blue-500 hover:text-white dark:text-white focus:ring-4 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800">
                            <span
                                class="relative px-5 py-2.5 transition-all ease-in duration-75 bg-white dark:bg-gray-900 rounded-md group-hover:bg-opacity-0">
                                Add Benefeciary
                            </span>
                        </button>
                    </div>

                    <div class="mt-5 h-[300px] overflow-y-scroll relative   shadow-md sm:rounded-lg">
                        <table class="w-full   text-sm text-left text-gray-500 dark:text-gray-400">
                            <thead
                                class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                                <tr>
                                    <th scope="col" class="px-6 py-3">

                                    </th>
                                    <th scope="col" class="px-6 py-3">
                                        Name
                                    </th>
                                    <th scope="col" class="px-6 py-3">
                                        Account Number
                                    </th>

                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of BeneficiaryData"
                                    class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                                    <td class="w-5 p-4 flex justify-center items-center">
                                        <div class=" ml-5 flex items-center ">
                                            <input [(ngModel)]="SelectAccount" [id]="item.beneficiaryId"
                                                type="radio" [value]="item" name="default-radio"
                                                class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                                        </div>
                                    </td>
                                    <th scope="row"
                                        class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">

                                        {{item.short_name}}
                                    </th>
                                    <td class="px-6 py-4 text-gray-700">
                                        {{item.account_number}}
                                    </td>

                                </tr>



                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- NOTE -->
                <!-- <div>

                    <h2 class="mb-2 text-lg font-semibold text-gray-900 dark:text-white">Note: </h2>
                    <ul class="max-w-md space-y-1 text-gray-500 list-disc list-inside dark:text-gray-400">
                        <li>
                            At least 10 characters (and up to 100 characters)
                        </li>
                        <li>
                            At least one lowercase character
                        </li>
                        <li>
                            Inclusion of at least one special character, e.g., ! @ # ?
                        </li>
                    </ul>

                </div> -->

                <!-- button data-modal-target="staticModal" data-modal-toggle="staticModal"-->
                <div class="flex justify-around mt-10">

                    <button (click)="transferFund()" type="button"
                        class="w-[40%] py-2.5 px-5 mr-2 mb-2 text-[18px] hover:text-white font-medium text-gray-900 focus:outline-none border-2 border-green-500 hover:bg-green-500 rounded-full focus:z-10 focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700">
                        Transfer
                    </button>

                </div>



            </div>
        </div>

        <!-- another page transfer -->

        <div [ngClass]="tab==2?'block':'hidden'" class=" p-4 rounded-lg ">
            <div class="w-[50%]">
                <!-- account to be debited -->
                <div class="mb-6">
                    <label for="debited"
                        class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Account to be
                        debited</label>
                    <input type="text" id="debited" [(ngModel)]="AccountNumber"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                        [disabled]="true" required>
                </div>
                <!-- account to be credited -->

                <div class="mb-6">
                    <div class="flex justify-between items-center">
                        <label for="debited"
                            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Account to be
                            Credited</label>
                        <button routerLink="/user/beneficiary-maintenance-page"
                            class="relative inline-flex items-center justify-center p-0.5 mb-2 mr-2 overflow-hidden text-sm font-medium text-gray-900 rounded-lg group bg-gradient-to-br from-purple-600 to-blue-500 group-hover:from-purple-600 group-hover:to-blue-500 hover:text-white dark:text-white focus:ring-4 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800">
                            <span
                                class="relative px-5 py-2.5 transition-all ease-in duration-75 bg-white dark:bg-gray-900 rounded-md group-hover:bg-opacity-0">
                                Add Benefeciary
                            </span>
                        </button>
                    </div>

                    <div class="mt-5 h-[300px] overflow-y-scroll relative   shadow-md sm:rounded-lg">
                        <table class="w-full   text-sm text-left text-gray-500 dark:text-gray-400">
                            <thead
                                class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                                <tr>
                                    <th scope="col" class="px-6 py-3">

                                    </th>
                                    <th scope="col" class="px-6 py-3">
                                        Name
                                    </th>
                                    <th scope="col" class="px-6 py-3">
                                        Account Number
                                    </th>
                                    <th scope="col" class="px-6 py-3">
                                        IFSC Code
                                    </th>

                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of DiffentBeneficiaryData"
                                    class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                                    <td class="w-5 p-4 flex justify-center items-center">
                                        <div class=" ml-5 flex items-center ">
                                            <input [(ngModel)]="SelectAccount" [id]="item.beneficiaryId"
                                                type="radio" [value]="item" name="default-radio"
                                                class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                                        </div>
                                    </td>
                                    <th scope="row"
                                        class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">

                                        {{item.short_name}}
                                    </th>
                                    <td class="px-6 py-4 text-gray-700">
                                        {{item.account_number}}
                                    </td>
                                    <td class="px-6 py-4 text-gray-700">
                                        {{item.ifsc_code}}
                                    </td>

                                </tr>


                            </tbody>
                        </table>
                    </div>
                </div>


                <!-- button -->
                <div class="flex justify-around mt-10">
                    <button [class]="hasProperties()?'cursor-pointer':'cursor-not-allowed'" (click)="transferFund()"
                        type="button"
                        class="w-[40%] py-2.5 px-5 mr-2 mb-2 text-[18px] hover:text-white font-medium text-gray-900 focus:outline-none border-2 border-green-500 hover:bg-green-500 rounded-full focus:z-10 focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700">
                        Transfer
                    </button>

                </div>

            </div>
        </div>

    </div>
</div>
