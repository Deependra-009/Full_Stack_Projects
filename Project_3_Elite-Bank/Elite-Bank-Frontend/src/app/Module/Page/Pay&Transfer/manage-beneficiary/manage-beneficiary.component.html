<div class="w-[100%]">
  <div>
    <h1>Manage Beneficiary</h1>
  </div>
  <div class="w-[100%] mt-5">
    <div class="p-3 relative overflow-x-auto shadow-md sm:rounded-lg">
      <div class="pb-4 bg-white dark:bg-gray-900">
        <label for="table-search" class="sr-only">Search</label>
        <div class="relative mt-1">
          <div
            class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
          >
            <svg
              class="w-4 h-4 text-gray-500 dark:text-gray-400"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 20 20"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
              />
            </svg>
          </div>
          <input
            type="text"
            id="table-search"
            class="block p-2 pl-10 text-sm text-gray-900 border border-gray-300 rounded-lg w-80 bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
            placeholder="Search for items"
          />
        </div>
      </div>
      <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
        <thead
          class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400"
        >
          <tr>
            <th scope="col" class="p-4">S.No</th>
            <th scope="col" class="py-3">Beneficiary Name</th>
            <th scope="col" class="py-3">Account Number</th>
            <th scope="col" class="py-3">IFSC Code</th>
            <th scope="col" class="py-3">Active</th>
            <th scope="col" class="py-3">Status</th>

            <th scope="col" class="text-center py-3">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let item of AllBeneficiaryData; index as i"
            class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600"
          >
            <td class="w-4 p-4">
              <div class="flex items-center justify-center">
                {{ i + 1 }}
              </div>
            </td>
            <th
              scope="row"
              class="py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white"
            >
              {{ item.short_name }}
            </th>
            <td class="py-4">
              {{ item.account_number }}
            </td>
            <td class="py-4">
              {{ item.ifsc_code == null ? "Same Bank" : item.ifsc_code }}
            </td>

            <td class="py-4 flex items-center">
              <div
                [class]="item.active ? 'bg-green-500' : 'bg-red-500'"
                class="ml-3 h-3 w-3 rounded-full mr-2"
              ></div>
              {{ item.active ? "Active" : "Not Active" }}
            </td>
            <td class="py-4">
              <div
                [class]="item.active ? 'text-green-600' : 'text-red-600'"
                class="font-medium dark:text-blue-500"
              >
                {{ item.active ? "Enable" : "Disable" }}
              </div>
            </td>
            <td class="py-4 flex justify-around">
              <div
                class="font-medium text-blue-600 dark:text-blue-500 hover:cursor-pointer"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-pencil"
                >
                  <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                  <path d="m15 5 4 4" />
                </svg>
              </div>
              <div
                (click)="deleteBenefiacry(item)"
                class="font-medium text-red-600 dark:text-red-500 hover:cursor-pointer"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-trash"
                >
                  <path d="M3 6h18" />
                  <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                </svg>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
